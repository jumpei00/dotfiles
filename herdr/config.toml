[keys]
prefix = "ctrl+q"

help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"

workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

next_agent = "prefix+]"
previous_agent = "prefix+["
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "$HOME/dotfiles/claude/scripts/chw --prompt --no-attach"

[[keys.command]]
key = "prefix+alt+r"
type = "pane"
command = "$HOME/dotfiles/claude/scripts/chw -r --prompt --no-attach"

[[keys.command]]
key = "prefix+alt+x"
type = "pane"
command = "$HOME/dotfiles/codex/scripts/xhw --prompt --no-attach"

[[keys.command]]
key = "prefix+alt+z"
type = "pane"
command = "$HOME/dotfiles/codex/scripts/xhw -r --prompt --no-attach"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[session]
resume_agents_on_restore = true
