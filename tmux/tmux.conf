set -g mouse on
set -sg escape-time 0
set -g focus-events on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g history-limit 10000

set -g set-titles on
set -g set-titles-string "#S #W"

bind N command-prompt -p "new worktree:" "run-shell '$HOME/.claude/scripts/cw %1'"
bind R command-prompt -p "resume worktree:" "run-shell '$HOME/.claude/scripts/cw -r %1'"
