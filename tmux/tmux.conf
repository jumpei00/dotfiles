set -g mouse on
set -sg escape-time 0
set -g focus-events on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g history-limit 10000

set -g set-titles on
set -g set-titles-string "#S #W"

# Prefix: C-b → C-q (avoids INSERT-mode C-b conflict in nvim)
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Pane navigation with hjkl after prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind N command-prompt -p "new worktree:" "run-shell '$HOME/dotfiles/claude/scripts/cct %1'"
bind R command-prompt -p "resume worktree:" "run-shell '$HOME/dotfiles/claude/scripts/cct -r %1'"
